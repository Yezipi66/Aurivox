name: CI

# 什么时候跑：推与 PR 都跑。
#   这个仓库的测试只需要 Node 与一个 Python 解释器，不需要显卡，
#   也不需要任何引擎的权重 ⇒ 每次提交都跑得起。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一个分支的旧跑次还没完就取消它：省 CI 时间，且只留最后一次结果。
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          # 24：Node 20 在 actions runner 上已废弃（被强制跑在 Node 24），
          #   显式写 24 免得每次跑都带一条 deprecation 警告。
          node-version: '24'
          cache: npm

      # 平台根 venv：几组测试要它（buildVenvStep / resolveUv 都从
      # <root>/venv 找解释器与 uv）。它不进版本库（.gitignore 第 31 行），
      # 所以 CI 上要现建。
      # 解释器版本固定成 3.11：内嵌解释器（tools/runtime/python）就是 3.11，
      # 而几组测试要拿根 venv 的解释器去跑平台自己的 .py。
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 缓存键要指准：默认的 **/requirements.txt 会匹配到
          #   engines/gpt-sovits/infer/requirements.txt（某台引擎的依赖，
          #   不是平台的），缓存跟着它变就等于没缓存。
          cache: pip
          cache-dependency-path: requirements-platform.txt

      - name: 装依赖
        run: npm ci

      # web/ 的依赖也要装：根目录的测试里有几条要从 web/node_modules 取编译依赖
      #   （@babel/parser 与 esbuild 已在根 devDependencies 里声明，
      #   但 web/ 自己那份 Vite 依赖树也要装，前端的构建与那条测试都要它）。
      - name: 装前端依赖
        run: npm ci --prefix web

      - name: 建平台根 venv 并装 uv
        run: |
          python3 -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install uv

      # 跑测试。
      #   输出要能看清：spec reporter 逐条打印两千多条测试名，GitHub 会把
      #   日志截断 ⇒ 失败原因正好在被截掉的那一段。
      #   所以这里把完整输出写进文件，再把失败摘要用 ::error:: 注解打出来
      #   （注解显示在页面上，不必翻日志、不必下载 artifact）。
      - name: 跑测试
        run: |
          set -o pipefail
          npm test > test-output.log 2>&1 || {
            echo "::group::失败摘要"
            grep -E "^(✖|not ok|ℹ (tests|pass|fail|skipped))" test-output.log | head -80 || true
            echo "::endgroup::"
            # 每条失败一行注解：页面的 Annotations 面板直接列出，不用翻日志。
            grep -E "^✖ " test-output.log | head -20 | while IFS= read -r line; do
              echo "::error title=测试失败::${line#✖ }"
            done
            echo "::group::日志末尾 60 行"
            tail -60 test-output.log
            echo "::endgroup::"
            exit 1
          }
          grep -E "^ℹ (tests|pass|fail|skipped)" test-output.log

      # 完整日志留档：日志页面会被截断，而失败原因常在最后。
      - name: 留档测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

      - name: 构建前端
        run: npm run build
